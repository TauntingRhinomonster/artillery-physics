<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>artillery-physics</title>
  </head>
  <body>
    <div id="app">
      <h1>Artillery Physics</h1>
      <div class="controls">
        <label>
          Angle (°)
          <input type="number" id="angle" value="45" min="0" max="90" />
        </label>
        <label>
          Weight (kg)
          <input type="number" id="weight" value="27" min="1" step="1" />
        </label>
        <label>
          Drag coefficient
          <input type="number" id="drag-coefficient" value="0.1" min="0" step="0.01" />
        </label>
        <label>
          Power (N)
          <input type="number" id="power" value="40500" min="1" step="100" />
        </label>
        <button id="fire-btn" type="button">Fire!</button>
      </div>
      <pre id="trajectory-display" aria-label="Trajectory visualization"></pre>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
